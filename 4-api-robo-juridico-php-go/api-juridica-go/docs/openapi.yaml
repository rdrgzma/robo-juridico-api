openapi: 3.1.0
info:
  title: Robô Jurídico — API de Processos
  description: |
    API REST de alta performance para consulta e monitoramento de processos judiciais brasileiros.
    Consolida em tempo real dados públicos federados do **DataJud** (Conselho Nacional de Justiça)
    e do **DJEN** (Diário de Justiça Eletrônico Nacional / ComunicaPJe).
    
    ### Autenticação
    Todas as rotas de dados exigem o envio da chave no cabeçalho `X-API-Key`.
    As chaves dos clientes são geradas com cota mensal e limite por minuto.
    Chaves internas configuradas no servidor possuem acesso irrestrito sem consumo de cota.
    
    ### Controle de Cotas
    Requisições faturáveis debitam 1 consulta da cota mensal contratada.
    Em caso de falha de validação ou indisponibilidade da fonte (HTTP >= 400), a consulta é estornada automaticamente.
  version: 1.0.0
  contact:
    name: Suporte Robô Jurídico
    email: suporte@empresa.com.br
servers:
  - url: http://localhost:8000
    description: Servidor Local de Desenvolvimento
  - url: https://api.seudominio.com.br
    description: Servidor de Produção (HTTPS)

security:
  - ApiKeyAuth: []

paths:
  /saude:
    get:
      tags:
        - Sistema
      summary: Verificação de Saúde da API (Liveness / Readiness)
      description: Retorna o status de operacionalidade da API e a versão atual. Rota pública que não requer autenticação.
      security: []
      responses:
        '200':
          description: API saudável e pronta para receber requisições.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                  - versao
                properties:
                  ok:
                    type: boolean
                    example: true
                  versao:
                    type: string
                    example: "1.0.0"

  /v1/cnj/{numero}:
    get:
      tags:
        - Utilitários
      summary: Decodifica e Valida Número CNJ
      description: |
        Analisa a máscara do processo, calcula o dígito verificador módulo 97 (Resolução CNJ 65/2008)
        e identifica o tribunal e segmento competente **sem consultar fontes externas**.
        Não consome cota do cliente.
      parameters:
        - name: numero
          in: path
          required: true
          description: Número do processo com ou sem pontuação (ex.: 5053283-30.2024.8.13.0079)
          schema:
            type: string
            example: "5053283-30.2024.8.13.0079"
      responses:
        '200':
          description: Resultado da decodificação do número CNJ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaCNJ'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'

  /v1/processos/{numero}/existe:
    get:
      tags:
        - Processos
      summary: Checagem Rápida de Existência do Processo
      description: |
        Verifica se o processo já consta registrado no DataJud ou possui publicações no DJEN.
        Ideal para triagens de pré-cadastro em lote. Não consome cota do plano.
      parameters:
        - name: numero
          in: path
          required: true
          description: Número CNJ do processo (com ou sem pontuação)
          schema:
            type: string
            example: "5053283-30.2024.8.13.0079"
      responses:
        '200':
          description: Status de existência retornado com sucesso.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaExiste'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '422':
          $ref: '#/components/responses/NumeroInvalido'
        '503':
          $ref: '#/components/responses/FonteIndisponivel'

  /v1/processos/{numero}:
    get:
      tags:
        - Processos
      summary: Consulta Detalhada do Processo Judicial
      description: |
        Retorna todos os dados consolidados do processo judicial: capa, órgão julgador, polos
        ativo/passivo/terceiros, advogados, histórico integral de movimentações e publicações de diário.
        
        **Consome 1 consulta da cota mensal.**
      parameters:
        - name: numero
          in: path
          required: true
          description: Número CNJ com ou sem pontuação
          schema:
            type: string
            example: "5053283-30.2024.8.13.0079"
        - name: modo
          in: query
          required: false
          description: |
            `completo` (padrão): consulta federada DataJud + DJEN em paralelo.
            `rapido`: consulta apenas publicações no DJEN (resposta ultrarrápida sem histórico interno do DataJud).
          schema:
            type: string
            enum: [completo, rapido]
            default: completo
        - name: publicacoes
          in: query
          required: false
          description: Define se deve incluir as publicações do DJEN no modo completo.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Processo localizado e dados consolidados com sucesso.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Cota-Limite:
              $ref: '#/components/headers/X-Cota-Limite'
            X-Cota-Usada:
              $ref: '#/components/headers/X-Cota-Usada'
            X-Cota-Restante:
              $ref: '#/components/headers/X-Cota-Restante'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaProcesso'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '402':
          $ref: '#/components/responses/CotaEsgotada'
        '403':
          $ref: '#/components/responses/ContaSuspensa'
        '404':
          description: Processo não encontrado nas fontes públicas consultadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
              example:
                ok: false
                erro:
                  codigo: processo_nao_encontrado
                  mensagem: "O processo não aparece no DataJud nem no DJEN. Se foi distribuído agora, tente de novo mais tarde; processo em segredo de justiça não é publicado."
                id_requisicao: "0090ea8b83174305"
        '422':
          $ref: '#/components/responses/NumeroInvalido'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
        '502':
          $ref: '#/components/responses/FalhaNaFonte'
        '503':
          $ref: '#/components/responses/FonteIndisponivel'

  /v1/oab/{uf}/{numero}/processos:
    get:
      tags:
        - OAB
      summary: Processos Vinculados à Inscrição da OAB
      description: |
        Pesquisa processos com publicações recentes em nome do advogado no DJEN e agrupa
        os resultados por número de processo.
        
        **Consome 1 consulta da cota mensal.**
      parameters:
        - name: uf
          in: path
          required: true
          description: Sigla da Unidade Federativa da seccional da OAB (ex.: MG, SP, RJ)
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: "MG"
        - name: numero
          in: path
          required: true
          description: Número da inscrição na OAB (com ou sem letra)
          schema:
            type: string
            example: "123456"
        - name: dias
          in: query
          required: false
          description: Quantidade de dias retroativos de busca (1 a 365)
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: tribunal
          in: query
          required: false
          description: Sigla do tribunal para filtrar (ex.: TJMG, TRF1, TRT3)
          schema:
            type: string
            example: "TJMG"
      responses:
        '200':
          description: Lista resumida de processos agrupados.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Cota-Limite:
              $ref: '#/components/headers/X-Cota-Limite'
            X-Cota-Usada:
              $ref: '#/components/headers/X-Cota-Usada'
            X-Cota-Restante:
              $ref: '#/components/headers/X-Cota-Restante'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaOABProcessos'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '402':
          $ref: '#/components/responses/CotaEsgotada'
        '422':
          description: UF ou parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaErro'
        '503':
          $ref: '#/components/responses/FonteIndisponivel'

  /v1/oab/{uf}/{numero}/publicacoes:
    get:
      tags:
        - OAB
      summary: Publicações do DJEN da OAB no Período (Controle de Prazos)
      description: |
        Recupera as publicações completas com teor sanitizado expedidas no Diário da Justiça
        Eletrônico Nacional para a inscrição da OAB especificada.
        
        **Consome 1 consulta da cota mensal.**
      parameters:
        - name: uf
          in: path
          required: true
          description: Sigla da UF da OAB (ex.: MG)
          schema:
            type: string
            minLength: 2
            maxLength: 2
            example: "MG"
        - name: numero
          in: path
          required: true
          description: Número da OAB
          schema:
            type: string
            example: "123456"
        - name: dias
          in: query
          required: false
          description: Período em dias retroativos (1 a 90)
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 7
        - name: paginas
          in: query
          required: false
          description: Quantidade de páginas (100 publicações por página, de 1 a 20)
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 1
      responses:
        '200':
          description: Lista de publicações na íntegra.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
            X-Cota-Limite:
              $ref: '#/components/headers/X-Cota-Limite'
            X-Cota-Usada:
              $ref: '#/components/headers/X-Cota-Usada'
            X-Cota-Restante:
              $ref: '#/components/headers/X-Cota-Restante'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaOABPublicacoes'
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '402':
          $ref: '#/components/responses/CotaEsgotada'
        '503':
          $ref: '#/components/responses/FonteIndisponivel'

  /v1/conta:
    get:
      tags:
        - Conta
      summary: Extrato da Conta e Consumo da Cota Mensal
      description: |
        Retorna os detalhes do plano da chave autenticada, limite mensal contratado,
        consultas já faturadas no mês, saldo restante e data/hora da renovação automática.
        Não consome cota.
      responses:
        '200':
          description: Dados da conta retornados com sucesso.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/X-Request-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespostaConta'
        '401':
          $ref: '#/components/responses/NaoAutorizado'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Chave de API exclusiva atribuída ao cliente.

  headers:
    X-Request-ID:
      description: Identificador único da requisição (hexadecimal de 16 caracteres) para rastreabilidade.
      schema:
        type: string
        example: "a81d2f70364e09cb"
    X-Cota-Limite:
      description: Total de consultas permitidas no mês de faturamento vigente.
      schema:
        type: integer
        example: 2000
    X-Cota-Usada:
      description: Total de consultas consumidas no mês corrente.
      schema:
        type: integer
        example: 42
    X-Cota-Restante:
      description: Saldo remanescente de consultas até a renovação mensal.
      schema:
        type: integer
        example: 1958
    Retry-After:
      description: Tempo em segundos que o cliente deve aguardar antes de tentar novamente.
      schema:
        type: integer
        example: 30

  responses:
    NaoAutorizado:
      description: Chave ausente, inválida ou formato incorreto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: nao_autorizado
              mensagem: "Envie uma chave válida no cabeçalho X-API-Key."
            id_requisicao: "0090ea8b83174305"

    CotaEsgotada:
      description: Cota mensal do plano esgotada.
      headers:
        X-Cota-Limite:
          $ref: '#/components/headers/X-Cota-Limite'
        X-Cota-Usada:
          $ref: '#/components/headers/X-Cota-Usada'
        X-Cota-Restante:
          $ref: '#/components/headers/X-Cota-Restante'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: cota_esgotada
              mensagem: "A cota de 2000 consultas do mês acabou. Ela renova no dia 1º; para ampliar agora, fale com o suporte."
            id_requisicao: "0090ea8b83174305"

    ContaSuspensa:
      description: Conta inativa ou suspensa administrativamente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: conta_suspensa
              mensagem: "Conta suspensa. Fale com o suporte."
            id_requisicao: "0090ea8b83174305"

    NumeroInvalido:
      description: Número fora do padrão CNJ ou com dígito verificador incorreto.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: numero_invalido
              mensagem: "Número fora do padrão CNJ (NNNNNNN-DD.AAAA.J.TR.OOOO) ou com dígito verificador errado."
            id_requisicao: "0090ea8b83174305"

    LimiteExcedido:
      description: Taxa de requisições por minuto excedida (Rate Limit).
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: limite_excedido
              mensagem: "Limite de 60 requisições por minuto atingido."
            id_requisicao: "0090ea8b83174305"

    FalhaNaFonte:
      description: A fonte do CNJ devolveu uma resposta inesperada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: falha_na_fonte
              mensagem: "A fonte do CNJ devolveu uma resposta inesperada."
            id_requisicao: "0090ea8b83174305"

    FonteIndisponivel:
      description: A fonte do CNJ (DataJud ou DJEN) está instável ou fora do ar.
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RespostaErro'
          example:
            ok: false
            erro:
              codigo: fonte_indisponivel
              mensagem: "A fonte datajud não respondeu. Tente de novo em instantes."
            id_requisicao: "0090ea8b83174305"

  schemas:
    RespostaErro:
      type: object
      required:
        - ok
        - erro
      properties:
        ok:
          type: boolean
          example: false
        erro:
          $ref: '#/components/schemas/CorpoErro'
        id_requisicao:
          type: string
          example: "0090ea8b83174305"

    CorpoErro:
      type: object
      required:
        - codigo
        - mensagem
      properties:
        codigo:
          type: string
          example: "numero_invalido"
        mensagem:
          type: string
          example: "Número fora do padrão CNJ."
        detalhes:
          type: array
          items:
            $ref: '#/components/schemas/DetalheErro'

    DetalheErro:
      type: object
      properties:
        campo:
          type: string
          example: "dias"
        mensagem:
          type: string
          example: "Deve ser entre 1 e 365"

    RespostaCNJ:
      type: object
      required:
        - ok
        - numero
        - numero_digitos
        - valido
      properties:
        ok:
          type: boolean
          example: true
        numero:
          type: string
          example: "5053283-30.2024.8.13.0079"
        numero_digitos:
          type: string
          example: "50532833020248130079"
        valido:
          type: boolean
          example: true
        tribunal:
          type: string
          example: "TJMG"
        segmento:
          type: string
          example: "Justiça Estadual"
        ano:
          type: integer
          example: 2024
        origem_codigo:
          type: integer
          example: 79

    RespostaExiste:
      type: object
      required:
        - ok
        - numero
        - existe
      properties:
        ok:
          type: boolean
          example: true
        numero:
          type: string
          example: "5053283-30.2024.8.13.0079"
        existe:
          type: boolean
          example: true
        fonte:
          type: string
          example: "datajud"

    RespostaProcesso:
      type: object
      required:
        - ok
        - consultado_em
        - tempo_ms
        - avisos
        - processo
      properties:
        ok:
          type: boolean
          example: true
        consultado_em:
          type: string
          format: date-time
          example: "2026-10-13T18:30:00Z"
        tempo_ms:
          type: integer
          example: 450
        avisos:
          type: array
          items:
            type: string
          example: []
        processo:
          $ref: '#/components/schemas/Processo'

    Processo:
      type: object
      required:
        - numero
        - numero_digitos
        - titulo
        - polos
        - advogados
        - movimentacoes
        - publicacoes
        - totais
        - fontes
      properties:
        numero:
          type: string
          example: "5053283-30.2024.8.13.0079"
        numero_digitos:
          type: string
          example: "50532833020248130079"
        titulo:
          type: string
          example: "JOAO DA SILVA × BANCO EXEMPLO S.A."
        tribunal:
          type: string
          example: "TJMG"
        segmento:
          type: string
          example: "Justiça Estadual"
        grau:
          type: string
          example: "G1"
        classe:
          type: string
          example: "Procedimento Comum Cível"
        assunto:
          type: string
          example: "Indenização por Dano Material"
        orgao_julgador:
          type: string
          example: "2ª Vara Cível da Comarca de Contagem"
        comarca:
          type: string
          example: "Contagem"
        link:
          type: string
          example: "https://pje.tjmg.jus.br/pje/ConsultaPublica/detalheProcessoConsultaPublica.seam?idProcesso=123"
        valor_causa:
          type: number
          format: float
          nullable: true
          example: 15420.50
        valor_causa_formatado:
          type: string
          example: "R$ 15.420,50"
        data_ajuizamento:
          type: string
          format: date-time
          nullable: true
          example: "2024-03-15T14:30:00Z"
        data_ajuizamento_formatada:
          type: string
          example: "15/03/2024"
        data_ultima_movimentacao:
          type: string
          example: "2026-09-20"
        data_ultima_movimentacao_formatada:
          type: string
          example: "20/09/2026"
        polos:
          $ref: '#/components/schemas/Polos'
        advogados:
          type: array
          items:
            $ref: '#/components/schemas/Advogado'
        movimentacoes:
          type: array
          items:
            $ref: '#/components/schemas/Movimentacao'
        publicacoes:
          type: array
          items:
            $ref: '#/components/schemas/Publicacao'
        totais:
          $ref: '#/components/schemas/Totais'
        fontes:
          type: array
          items:
            type: string
          example: ["datajud", "comunica"]

    Polos:
      type: object
      properties:
        ativo:
          type: array
          items:
            $ref: '#/components/schemas/Parte'
        passivo:
          type: array
          items:
            $ref: '#/components/schemas/Parte'
        terceiros:
          type: array
          items:
            $ref: '#/components/schemas/Parte'

    Parte:
      type: object
      required:
        - nome
        - polo
      properties:
        nome:
          type: string
          example: "JOAO DA SILVA"
        polo:
          type: string
          enum: [ativo, passivo, terceiro]
          example: "ativo"
        advogados:
          type: array
          items:
            $ref: '#/components/schemas/Advogado'

    Advogado:
      type: object
      required:
        - nome
      properties:
        nome:
          type: string
          example: "DR. CARLOS ALBERTO PEREIRA"
        oab_numero:
          type: string
          example: "123456"
        oab_uf:
          type: string
          example: "MG"
        oab:
          type: string
          example: "OAB/MG 123456"

    Movimentacao:
      type: object
      required:
        - data
        - data_formatada
        - tipo
        - descricao
        - fonte
      properties:
        data:
          type: string
          format: date-time
          example: "2026-09-20T11:42:00Z"
        data_formatada:
          type: string
          example: "20/09/2026"
        tipo:
          type: string
          example: "despacho"
        descricao:
          type: string
          example: "Mero expediente deferindo a juntada de documentos"
        complemento:
          type: string
          example: "Prazo de 15 dias"
        orgao:
          type: string
          example: "2ª Vara Cível"
        fonte:
          type: string
          example: "datajud"
        link:
          type: string
          example: ""

    Publicacao:
      type: object
      required:
        - id
        - texto
      properties:
        id:
          type: string
          example: "djen-987654"
        data_disponibilizacao:
          type: string
          example: "2026-09-21"
        data_formatada:
          type: string
          example: "21/09/2026"
        tipo_comunicacao:
          type: string
          example: "Intimação Eletrônica"
        tipo_documento:
          type: string
          example: "Despacho"
        orgao:
          type: string
          example: "2ª Vara Cível da Comarca de Contagem"
        numero_processo:
          type: string
          example: "5053283-30.2024.8.13.0079"
        classe:
          type: string
          example: "Procedimento Comum Cível"
        texto:
          type: string
          example: "Fica o autor intimado para réplica no prazo legal."
        link:
          type: string
          example: "https://comunica.pje.jus.br/comunicacao/987654"
        partes:
          type: array
          items:
            $ref: '#/components/schemas/Parte'
        advogados:
          type: array
          items:
            $ref: '#/components/schemas/Advogado'

    Totais:
      type: object
      required:
