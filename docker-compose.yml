services:
  robo-juridico-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-juridico-api:latest
    container_name: robo-juridico-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Persistência do banco de dados SQLite (clientes, cotas, auditoria)
      - ./dados:/app/dados
      # Arquivo de configurações e segredos (somente leitura)
      - ./.env:/app/.env:ro
    environment:
      - API_BANCO=/app/dados/api.db
      - API_COOKIE_SEGURO=1
      - API_PROXY_CONFIAVEL=127.0.0.1,172.16.0.0/12,10.0.0.0/8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
